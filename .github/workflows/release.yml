name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Vidget.app
        run: ./build.sh

      - name: Zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Vidget.app Vidget.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Vidget
          path: build/Vidget.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Vidget.zip
          generate_release_notes: true

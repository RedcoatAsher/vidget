name: Build

# CI only checks that the project builds (ad-hoc signed; no certificates on the runner).
# Real releases are signed, notarized and uploaded from a Mac with ./release.sh.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build Vidget.app
        run: ./build.sh
      - name: Zip
        run: cd build && ditto -c -k --sequesterRsrc --keepParent Vidget.app Vidget-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Vidget-unsigned
          path: build/Vidget-unsigned.zip
